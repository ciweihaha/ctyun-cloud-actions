name: 天翼云电脑每日任务

on:
  schedule:
    - cron: '0 0 * * *'   # 08:00 Asia/Shanghai
    - cron: '0 12 * * *'  # 20:00 Asia/Shanghai
  workflow_dispatch:

# G10: 最小权限——兑换成功后要把 redeem-state.json 的变化推回仓库，
# 所以 contents 需要 write（只为回写兑换日期这一个用途）；secrets 仍经 env 传入。
permissions:
  contents: write

# G10: prevent overlapping runs against the same account
# 2026-11-12 审计：cancel-in-progress 保持 false —— 定时任务绝不能中途取消。
# 注意：cancel=false 时，若已有排队中的旧跑，会被更新的排队跑取代；本仓每天两班、
# 单次远小于 12 小时间隔，正常情况下不会出现排队，无需改动。
concurrency:
  group: ctyun-daily-tasks
  cancel-in-progress: false

jobs:
  ctyun-tasks:
    runs-on: ubuntu-latest
    # 2026-11-12 审计：任务实测 60–75 分钟；90 分钟上限在 10-18 至 10-25 期间
    # 导致 12 次定时跑被超时取消（node cli.js 步骤被 kill）。放宽到 180 分钟
    # 留足余量；GitHub 单 job 上限 360 分钟。
    timeout-minutes: 180
    steps:
      # G10: actions pinned to full commit SHA of the v7 tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # G10: reproducible install from lockfile (was: npm install --production)
      - run: npm ci --omit=dev
      # G10: test gate - unit tests must pass before real tasks run
      - name: Run unit tests (gate)
        run: npm test
      - env:
          CTYUN_USER: ${{ secrets.CTYUN_USER }}
          CTYUN_PASS: ${{ secrets.CTYUN_PASS }}
          # 自动兑换配置（redeemConfig JSON，见 README）。Secret 不存在时 GitHub 传空串，
          # cli.js 按未配置处理：兑换跳过，不报错退出，其他三项任务不受影响。
          CTYUN_REDEEM: ${{ secrets.CTYUN_REDEEM }}
        run: node cli.js
      # 回写兑换日期：node cli.js 兑换成功后会把当天日期写进 redeem-state.json，
      # 这一步把文件变化 commit 并推回 main 分支，下次跑就能读到最新日期。
      # 文件没变化时不提交、不报错。
      - name: 回写兑换日期 (redeem-state.json)
        run: |
          if [ -z "$(git status --porcelain -- redeem-state.json)" ]; then
            echo "redeem-state.json 无变化，跳过回写"
            exit 0
          fi
          DATE_STR=$(node -e "console.log(JSON.parse(require('fs').readFileSync('redeem-state.json','utf8')).lastRedeemDate || '')" 2>/dev/null || echo "")
          if [ -z "$DATE_STR" ]; then DATE_STR=$(TZ=Asia/Shanghai date +%F); fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add redeem-state.json
          git commit -m "chore: 更新兑换日期到 ${DATE_STR}"
          git push
