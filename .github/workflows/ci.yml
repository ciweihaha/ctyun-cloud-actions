name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # 2026-11-12 审计：cancel-in-progress: true 是预期行为，不要改成 false。
  # CI 单次约 1 分钟；同一分支数秒内连续推送时，旧跑被取消、只跑最新一次。
  # 2026-11-12 mica/review-fixes 分支 4 分钟内 10 次推送 → 9 次取消、最新 2 次成功，
  # 均属该机制正常工作。理顺靠推送节奏（本地先测、攒批一次推），不是关取消。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm ci --omit=dev
      - run: npm test
